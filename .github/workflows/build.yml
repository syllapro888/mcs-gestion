name: Tests et application Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    name: Tests du serveur
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node server/test.js

  windows:
    name: Installateur Windows (.exe)
    needs: tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer les outils
        run: npm install
      - name: Auto-test dans Electron
        run: npm run self-test
      - name: Fabriquer l'installateur
        run: npm run dist
      - name: Mettre l'installateur à disposition
        uses: actions/upload-artifact@v4
        with:
          name: MCS-Gestion-Windows
          path: desktop/dist/*.exe
          if-no-files-found: error
      - name: Publier une version (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/*.exe
