name: Tests et application Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    name: Tests du serveur
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node server/test.js

  windows:
    name: Installateur Windows (.exe)
    needs: tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer les outils
        run: npm install
      - name: Auto-test dans Electron
        run: npm run self-test
      - name: Fabriquer l'installateur
        run: npm run dist
      - name: Mettre l'installateur à disposition
        uses: actions/upload-artifact@v4
        with:
          name: MCS-Gestion-Windows
          path: desktop/dist/*.exe
          if-no-files-found: error
      - name: Publier la version dans « Releases »
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MCS Gestion 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Installateur Windows de MCS Gestion.
            Téléchargez le fichier `.exe` ci-dessous, puis double-cliquez dessus pour installer.
          files: desktop/dist/*.exe
